services:
  python-evaluator:
    build:
      context: ./python-evaluator
    ports:
      - "8000:8000"

  java-api:
    build:
      context: ./java-api
    environment:
      EVALUATOR_BASE_URL: http://python-evaluator:8000
    ports:
      - "8080:8080"
    depends_on:
      - python-evaluator
